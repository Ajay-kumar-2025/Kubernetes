trigger:
  branches:
    include:
    - main
  paths:
   include:
     - 02-aks-infra  
pool:
  name: dev-ado-agent

stages:
- stage: teraformcodevalidation
  displayName: Terraform Code Validation
  jobs:
  - job: terraform_init
    displayName: terraform init
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/02-aks-infra/environment/dev'
        backendServiceArm: 'ado-svc-wif'
        backendAzureRmResourceGroupName: 'rg_dev_axion'
        backendAzureRmStorageAccountName: 'stgdevaxion01'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'dev.terraform.tfstate'
    
  - job: terraform_format
    displayName: Terraform-Format
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'custom'
        workingDirectory: '$(System.DefaultWorkingDirectory)/02-aks-infra'
        outputTo: 'console'
        customCommand: 'terraform fmt -recursive'
        environmentServiceNameAzureRM: 'ado-svc-wif'

  - job: terraform_validate
    displayName: Terraform validate
    dependsOn: terraform_init
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/02-aks-infra/environment/dev'