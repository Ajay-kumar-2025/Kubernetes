trigger:
  branches:
    include:
      - main
  paths:
    include:
      - 02-aks-infra/**

pool:
  name: dev-ado-agent

stages:
- stage: teraformcodevalidation
  displayName: Terraform Code Validation
  jobs:
  - job: terraform_ci
    displayName: Terraform Validation Pipeline
    steps:
    # Format Check
    - task: TerraformTask@5
      displayName: Terraform Format Check
      inputs:
        provider: 'azurerm'
        command: 'custom'
        workingDirectory: '$(System.DefaultWorkingDirectory)/02-aks-infra'
        commandOptions: '-recursive -check'
        outputTo: 'console'
        customCommand: 'fmt'
        environmentServiceNameAzureRM: 'ado-svc-wif'

    # Init (Ye step pass hoga tabhi .terraform/modules install honge)
    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/02-aks-infra/environment/dev'
        backendServiceArm: 'ado-svc-wif'
        backendAzureRmResourceGroupName: 'rg_dev_axion'
        backendAzureRmStorageAccountName: 'stgdevaxion01'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'dev.terraform.tfstate'

    # Validate (Same workspace par modules mil jayenge)
    - task: TerraformTask@5
      displayName: Terraform Validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/02-aks-infra/environment/dev'

- stage: linting
  displayName: 'Code Linting'
  jobs:
  - job: run_tflint
    displayName: 'Execute TFLint'
    steps:
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          tflint --init
          tflint --recursive --force
        workingDirectory: '$(System.DefaultWorkingDirectory)/02-aks-infra'
  - job: run_yamllint
    displayName: Execute YAML Lint
    steps:
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          if (-not (Get-Command yamllint -ErrorAction SilentlyContinue)) {
              Write-Host "Installing yamllint via pip..."
              python -m pip install --upgrade pip yamllint
          }
          
          Write-Host "Running yamllint..."
          yamllint -d relaxed .
        workingDirectory: '$(System.DefaultWorkingDirectory)/02-aks-infra'