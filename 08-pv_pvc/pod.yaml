apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
spec:
  volumes:
    - name: dimple-volume
      persistentVolumeClaim:
        claimName: dimple-pvc
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80
      volumeMounts:
        - name: dimple-volume
          mountPath: /data
